name: Dhan Satya FNO Watchlist Cloud Scheduler

on:
  schedule:
    # 03:50 UTC corresponds to 09:20 AM IST (UTC + 5:30)
    # Runs Monday through Friday (1-5)
    - cron: '50 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-dhan-fno:
    name: Sync ATM Options to Dhan Satya FNO Watchlist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Execute Dhan FNO Momentum Watchlist Sync
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python dhan_fno_watchlist.py

      - name: Upload Watchlist CSV Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: satya-fno-watchlist-csv
          path: satya_fno_watchlist.csv
          retention-days: 7
